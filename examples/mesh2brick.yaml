#
# mesh2brick configuration - every value shown is the default.
# Any key can be overridden on the command line: --set section.key=value
# (e.g. --set placement.seed=3 or --set parts.categories=[brick,plate]).

input:
  up_axis: z            # x|y|z, optionally negative, e.g. -y (glTF/.blend: keep z)
  auto_orient: false
  scale_mode: studs     # studs: scale to target_height_cm or target_studs | mm: use mm_per_stud
  target_studs: 32      # longest model axis in studs (~26 cm; 48 = ~38 cm)
  target_height_cm: null    # height of the LEGO model in cm, e.g. 30 (replaces target_studs;
                            # rounded to whole bricks); on the command line: --size 30cm
  mm_per_stud: 8.0      # model millimetres per stud (a real stud pitch is 8 mm)
  multi_body: union     # union: merge several bodies | error: reject such files
  step_tolerance_mm: 0.05   # STEP: max distance surface <-> triangles
voxel:
  height_unit: brick    # brick (9.6 mm) | plate (3.2 mm) per voxel layer
  fill: hollow          # solid | hollow
  wall_thickness: 2     # shell thickness in voxels when hollow
  threshold: 0.5        # min. filled volume fraction for a voxel to count
  min_island_fraction: 0.05   # drop loose voxel islands below 5 % of the model
color:
  mode: auto            # auto (model colours if any) | cad | vertex | texture | single | height_bands
  single_color: 4       # LDraw colour code (4 = Red); also for surfaces without colour
  palette: common       # common: ~40 current LEGO colours | solid: all with catalogue numbers | all: every LDraw colour
  bands: [1, 2, 14, 25, 4]   # height_bands: colours bottom to top (Blue..Red)
parts:
  categories: [brick, plate]   # also: slope (slow with legolization 0.5.0), tile
  include: []           # whitelist of LDraw numbers, e.g. [3001, 3003]; see `mesh2brick catalog list`
  exclude: []           # blacklist, e.g. [3008, 3007]; 3005 and 3024 are always needed
  max_parts: 5000
  availability: exclude # parts LEGO does not make in a model colour: exclude | split | report
placement:
  backend: legolization
  strategy: kollsker    # passed to the backend (also: luo, greedy, bond, fast, smga, beauty)
  seed: 0
  time_limit_s: 300     # hard limit for a whole conversion; when reached: best stable model so far
  backend_options: {}   # extra legolization PipelineConfig fields, validated
stability:
  enabled: true
  max_repair_iterations: 20
steps:
  parts_per_step: 7
  keep_symmetry: true
  submodels: true
  sequencing: auto      # auto | thorough | fast | layers (see docs)
llm:                    # optional, needs: uv sync --extra llm + ANTHROPIC_API_KEY
  enabled: false
  model: claude-sonnet-5-5
  tasks: [group_steps, write_step_text]   # + choose_part (with parts.availability: report)
  effort: medium        # low | medium | high | xhigh | max (more effort, more tokens)
  max_cost_usd: 1.0     # cost limit per run; the run report logs the actual cost
  max_turns: 8          # requests per task (tool calls and one round of fixes)
  examples: 6           # example lines from runs rated 4-5 (mesh2brick feedback --rate)
  feedback: true        # record runs locally and learn from ratings
output:
  dir: ./out
  formats: [mpd, bom_csv, bom_bricklink, bom_rebrickable, pdf]   # ldr: one flat file
  language: de          # de | en (PDF text)
  page_size: A4         # A4 | letter
  steps_per_page: 2     # 1-4
